name: E2E

on:
  workflow_dispatch:
    inputs:
      base_url:
        description: 'Kong Gateway base URL'
        required: true
        default: 'http://10.10.10.240'

permissions:
  contents: read

concurrency:
  group: e2e-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  postman-newman:
    name: Postman E2E
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Generate demo JWTs
        id: tokens
        run: |
          python k8s/kong/scripts/generate-demo-jwts.py >> "$GITHUB_OUTPUT"

      - name: Install Newman
        run: npm install -g newman

      - name: Wait for Kong route
        env:
          E2E_BASE_URL: ${{ inputs.base_url }}
        run: sh tests/e2e/scripts/wait-for-services.sh

      - name: Run Postman collection with Newman
        run: |
          mkdir -p tests/e2e/newman/reports
          newman run tests/e2e/postman/medical-platform.postman_collection.json \
            -e tests/e2e/newman/docker.postman_environment.json \
            --env-var baseUrl="${{ inputs.base_url }}" \
            --env-var staffToken="${{ steps.tokens.outputs.STAFF_TOKEN }}" \
            --env-var patientToken="${{ steps.tokens.outputs.PATIENT_TOKEN }}" \
            --env-var doctorToken="${{ steps.tokens.outputs.DOCTOR_TOKEN }}" \
            --reporters cli,junit \
            --reporter-junit-export tests/e2e/newman/reports/e2e.xml

      - name: Upload E2E reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-reports
          path: |
            tests/e2e/newman/reports/
          if-no-files-found: ignore
