name: E2E

on:
  schedule:
    - cron: '0 18 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: e2e-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  postman-newman:
    name: Postman E2E
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Show Docker versions
        run: |
          docker version
          docker compose version

      - name: Run Postman collection with Newman
        run: make test-e2e

      - name: Collect Docker Compose logs
        if: failure()
        run: |
          mkdir -p tests/e2e/newman/reports
          docker compose -p medical-platform-test -f docker-compose.yml logs --no-color > tests/e2e/newman/reports/docker-compose.log || true

      - name: Upload E2E reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-reports
          path: |
            tests/e2e/newman/reports/
          if-no-files-found: ignore

      - name: Clean up E2E services
        if: always()
        run: docker compose -p medical-platform-test -f docker-compose.yml down --remove-orphans
