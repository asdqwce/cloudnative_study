name: Security

on:
  push:
    branches:
      - '**'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: security-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  source-security:
    name: Source security gates
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Gitleaks
        run: SECURITY_BOOTSTRAP_TOOLS=gitleaks sh scripts/security/bootstrap.sh

      - name: Scan repository secrets
        run: ./.tools/gitleaks detect --source . --redact --verbose

      - name: Verify Docker build contexts
        run: ./scripts/verify-dockerignore.sh

      - name: Lint Dockerfiles
        run: ./scripts/verify-dockerfiles.sh
