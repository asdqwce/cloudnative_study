name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Git tag to build and deploy, for example v1.2.3'
        required: true
        type: string

permissions:
  contents: write
  id-token: write

concurrency:
  group: release-${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || github.ref }}
  cancel-in-progress: false

env:
  AWS_REGION: ap-northeast-2
  ECR_REPOSITORY_PREFIX: ${{ vars.ECR_REPOSITORY_PREFIX }}
  IMAGE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || github.ref_name }}
  KUSTOMIZE_DIR: k8s/overlays/aws
  MANIFEST_BRANCH: release

jobs:
  source-security:
    name: Source security gates
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ env.IMAGE_TAG }}
          fetch-depth: 0

      - name: Validate release tag
        run: |
          case "$IMAGE_TAG" in
            v*) ;;
            *)
              echo "IMAGE_TAG must be a Git release tag such as v1.2.3." >&2
              exit 1
              ;;
          esac
          git rev-parse -q --verify "refs/tags/${IMAGE_TAG}^{tag}" >/dev/null ||
            git rev-parse -q --verify "refs/tags/${IMAGE_TAG}^{commit}" >/dev/null

      - name: Install Gitleaks
        run: SECURITY_BOOTSTRAP_TOOLS=gitleaks sh scripts/security/bootstrap.sh

      - name: Scan repository secrets
        run: ./.tools/gitleaks detect --source . --redact --verbose

      - name: Verify Docker build contexts
        run: ./scripts/verify-dockerignore.sh

      - name: Lint Dockerfiles
        run: ./scripts/verify-dockerfiles.sh

  build-images:
    name: Build and push ${{ matrix.service }}
    runs-on: ubuntu-latest
    needs: source-security
    strategy:
      fail-fast: false
      matrix:
        include:
          - service: auth-service
            context: ./services/auth-service
            dockerfile: ./services/auth-service/Dockerfile
            image: zexpand/auth-service
          - service: patient-service
            context: ./services/patient-service
            dockerfile: ./services/patient-service/Dockerfile
            image: zexpand/patient-service
          - service: appointment-service
            context: ./services/appointment-service
            dockerfile: ./services/appointment-service/Dockerfile
            image: zexpand/appointment-service
          - service: prescription-service
            context: ./services/prescription-service
            dockerfile: ./services/prescription-service/Dockerfile
            image: zexpand/prescription-service
          - service: notification-service
            context: ./services/notification-service
            dockerfile: ./services/notification-service/Dockerfile
            image: zexpand/notification-service
          - service: dashboard
            context: ./dashboard
            dockerfile: ./dashboard/Dockerfile
            image: zexpand/dashboard

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ env.IMAGE_TAG }}

      - name: Validate release configuration
        env:
          AWS_RELEASE_ROLE_ARN: ${{ vars.AWS_RELEASE_ROLE_ARN }}
        run: |
          if [ -z "$AWS_RELEASE_ROLE_ARN" ]; then
            echo "AWS_RELEASE_ROLE_ARN repository variable is required." >&2
            exit 1
          fi
          if [ -z "$ECR_REPOSITORY_PREFIX" ]; then
            echo "ECR_REPOSITORY_PREFIX repository variable is required." >&2
            exit 1
          fi

      - name: Normalize image tag
        run: |
          echo "LOCAL_IMAGE=${ECR_REPOSITORY_PREFIX}/${{ matrix.service }}:${IMAGE_TAG}" >> "$GITHUB_ENV"

      - name: Verify Docker build context
        run: |
          test -f "${{ matrix.dockerfile }}"
          ./scripts/verify-dockerignore.sh "${{ matrix.context }}"

      - name: Build image
        run: docker build --pull -f "${{ matrix.dockerfile }}" -t "$LOCAL_IMAGE" "${{ matrix.context }}"

      - name: Install Trivy
        run: SECURITY_BOOTSTRAP_TOOLS=trivy sh scripts/security/bootstrap.sh

      - name: Scan image before push
        run: ./.tools/trivy image --scanners vuln,secret,misconfig --severity HIGH,CRITICAL --ignore-unfixed --format table --exit-code 1 "$LOCAL_IMAGE"

      - name: Scan image history before push
        run: ./scripts/scan-docker-history.sh "$LOCAL_IMAGE"

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_RELEASE_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Push image
        env:
          ECR_REGISTRY: ${{ steps.ecr.outputs.registry }}
        run: |
          IMAGE_URI="${ECR_REGISTRY}/${ECR_REPOSITORY_PREFIX}/${{ matrix.service }}:${IMAGE_TAG}"
          docker tag "$LOCAL_IMAGE" "$IMAGE_URI"
          docker push "$IMAGE_URI"

  update-manifests:
    name: Update Git manifests
    runs-on: ubuntu-latest
    needs: build-images

    steps:
      - name: Checkout release branch
        uses: actions/checkout@v4
        with:
          ref: ${{ env.MANIFEST_BRANCH }}

      - name: Validate release configuration
        env:
          AWS_RELEASE_ROLE_ARN: ${{ vars.AWS_RELEASE_ROLE_ARN }}
        run: |
          if [ -z "$AWS_RELEASE_ROLE_ARN" ]; then
            echo "AWS_RELEASE_ROLE_ARN repository variable is required." >&2
            exit 1
          fi
          if [ -z "$ECR_REPOSITORY_PREFIX" ]; then
            echo "ECR_REPOSITORY_PREFIX repository variable is required." >&2
            exit 1
          fi

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_RELEASE_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Install kustomize
        uses: imranismail/setup-kustomize@v2

      - name: Normalize image tag
        run: |
          case "$IMAGE_TAG" in
            v*) ;;
            *)
              echo "IMAGE_TAG must be a Git release tag such as v1.2.3." >&2
              exit 1
              ;;
          esac

      - name: Update kustomize image tags
        env:
          ECR_REGISTRY: ${{ steps.ecr.outputs.registry }}
        run: |
          cd "$KUSTOMIZE_DIR"
          kustomize edit set image zexpand/auth-service="${ECR_REGISTRY}/${ECR_REPOSITORY_PREFIX}/auth-service:${IMAGE_TAG}"
          kustomize edit set image zexpand/patient-service="${ECR_REGISTRY}/${ECR_REPOSITORY_PREFIX}/patient-service:${IMAGE_TAG}"
          kustomize edit set image zexpand/appointment-service="${ECR_REGISTRY}/${ECR_REPOSITORY_PREFIX}/appointment-service:${IMAGE_TAG}"
          kustomize edit set image zexpand/prescription-service="${ECR_REGISTRY}/${ECR_REPOSITORY_PREFIX}/prescription-service:${IMAGE_TAG}"
          kustomize edit set image zexpand/notification-service="${ECR_REGISTRY}/${ECR_REPOSITORY_PREFIX}/notification-service:${IMAGE_TAG}"
          kustomize edit set image zexpand/dashboard="${ECR_REGISTRY}/${ECR_REPOSITORY_PREFIX}/dashboard:${IMAGE_TAG}"

      - name: Commit and push manifest update
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add "$KUSTOMIZE_DIR/kustomization.yaml"

          if git diff --cached --quiet; then
            echo "No manifest image tag changes to commit."
            exit 0
          fi

          git commit -m "deploy: update release images"
          git push origin "HEAD:${MANIFEST_BRANCH}"
