apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: medical-platform-dev
resources:
- namespace.yaml
- policy.yaml
- ../../../base/apps
- ../../../ingress/auth
- ../../../ingress/patient
- ../../../ingress/appointment
- ../../../ingress/prescription
- ../../../ingress/notification
- ../../../ingress/dashboard
images:
# Placeholder account/repository values are replaced by the release workflow.
# Decision point: add Kong/Python service images here after their manifests land on main.
- name: zexpand/auth-service
  newName: 000000000000.dkr.ecr.ap-northeast-2.amazonaws.com/cloudnative-study/auth-service
  newTag: release-placeholder
- name: zexpand/patient-service
  newName: 000000000000.dkr.ecr.ap-northeast-2.amazonaws.com/cloudnative-study/patient-service
  newTag: release-placeholder
- name: zexpand/appointment-service
  newName: 000000000000.dkr.ecr.ap-northeast-2.amazonaws.com/cloudnative-study/appointment-service
  newTag: release-placeholder
- name: zexpand/prescription-service
  newName: 000000000000.dkr.ecr.ap-northeast-2.amazonaws.com/cloudnative-study/prescription-service
  newTag: release-placeholder
- name: zexpand/notification-service
  newName: 000000000000.dkr.ecr.ap-northeast-2.amazonaws.com/cloudnative-study/notification-service
  newTag: release-placeholder
- name: zexpand/dashboard
  newName: 000000000000.dkr.ecr.ap-northeast-2.amazonaws.com/cloudnative-study/dashboard
  newTag: release-placeholder
patches:
- patch: |-
    - op: add
      path: /spec/rules/0/host
      value: dev.medical-platform.example.com
  target:
    group: networking.k8s.io
    kind: Ingress
    version: v1
- patch: |-
    - op: replace
      path: /spec/template/spec/containers/0/env/1/value
      value: kafka:9092
  target:
    group: apps
    kind: Deployment
    name: appointment-service
    version: v1
- patch: |-
    - op: replace
      path: /spec/template/spec/containers/0/env/1/value
      value: http://patient-service:8081
    - op: replace
      path: /spec/template/spec/containers/0/env/2/value
      value: kafka:9092
  target:
    group: apps
    kind: Deployment
    name: prescription-service
    version: v1
- patch: |-
    - op: replace
      path: /spec/template/spec/containers/0/env/1/value
      value: kafka:9092
  target:
    group: apps
    kind: Deployment
    name: notification-service
    version: v1
