apiVersion: v1
kind: ResourceQuota
metadata:
  name: medical-platform-quota
spec:
  hard:
    count/deployments.apps: "12"
    count/ingresses.networking.k8s.io: "12"
    count/pods: "30"
    count/services: "20"
---
apiVersion: v1
kind: LimitRange
metadata:
  name: medical-platform-limits
spec:
  limits:
    - type: Container
      defaultRequest:
        cpu: 50m
        memory: 128Mi
      default:
        cpu: 500m
        memory: 512Mi
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-same-namespace-and-kong-ingress
spec:
  podSelector: {}
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector: {}
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kong
