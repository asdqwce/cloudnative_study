name: CI

on:
  push:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: JUnit Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Detect changed areas
        id: changes
        uses: dorny/paths-filter@v3
        with:
          # 변경된 파일 경로를 기준으로 어떤 서비스 테스트를 실행할지 결정한다.
          # global에 해당하는 공통 설정이 바뀌면 특정 서비스만 검증하기 어렵기 때문에 전체 테스트를 실행한다.
          filters: |
            global:
              - '.github/workflows/ci.yml'
              - 'build.gradle'
              - 'settings.gradle'
              - 'gradle/**'
              - 'gradlew'
              - 'gradlew.bat'
              - 'tests/integration-support/**'
            eureka:
              - 'eureka-server/**'
            gateway:
              - 'api-gateway/**'
            patient:
              - 'patient-service/**'
            appointment:
              - 'appointment-service/**'
            prescription:
              - 'prescription-service/**'
            notification:
              - 'notification-service/**'

      # 공통 빌드/테스트 설정이 바뀌었거나 수동 실행한 경우에는 전체 JUnit 테스트를 실행한다.
      - name: Run all JUnit tests
        if: steps.changes.outputs.global == 'true' || github.event_name == 'workflow_dispatch'
        run: ./gradlew test testIntegration --no-daemon

      # 서비스별 파일만 바뀐 경우에는 해당 Gradle 모듈의 단위 테스트와 통합 테스트만 실행한다.
      - name: Test eureka server
        if: steps.changes.outputs.global != 'true' && github.event_name != 'workflow_dispatch' && steps.changes.outputs.eureka == 'true'
        run: ./gradlew :eureka-server:test :eureka-server:testIntegration --no-daemon

      - name: Test API gateway
        if: steps.changes.outputs.global != 'true' && github.event_name != 'workflow_dispatch' && steps.changes.outputs.gateway == 'true'
        run: ./gradlew :api-gateway:test :api-gateway:testIntegration --no-daemon

      - name: Test patient service
        if: steps.changes.outputs.global != 'true' && github.event_name != 'workflow_dispatch' && steps.changes.outputs.patient == 'true'
        run: ./gradlew :patient-service:test :patient-service:testIntegration --no-daemon

      - name: Test appointment service
        if: steps.changes.outputs.global != 'true' && github.event_name != 'workflow_dispatch' && steps.changes.outputs.appointment == 'true'
        run: ./gradlew :appointment-service:test :appointment-service:testIntegration --no-daemon

      - name: Test prescription service
        if: steps.changes.outputs.global != 'true' && github.event_name != 'workflow_dispatch' && steps.changes.outputs.prescription == 'true'
        run: ./gradlew :prescription-service:test :prescription-service:testIntegration --no-daemon

      - name: Test notification service
        if: steps.changes.outputs.global != 'true' && github.event_name != 'workflow_dispatch' && steps.changes.outputs.notification == 'true'
        run: ./gradlew :notification-service:test :notification-service:testIntegration --no-daemon

      # 문서나 E2E 전용 파일처럼 JUnit 테스트 대상이 아닌 변경만 있는 경우에는 테스트를 건너뛴다.
      - name: Skip JUnit tests
        if: >
          steps.changes.outputs.global != 'true' &&
          github.event_name != 'workflow_dispatch' &&
          steps.changes.outputs.eureka != 'true' &&
          steps.changes.outputs.gateway != 'true' &&
          steps.changes.outputs.patient != 'true' &&
          steps.changes.outputs.appointment != 'true' &&
          steps.changes.outputs.prescription != 'true' &&
          steps.changes.outputs.notification != 'true'
        run: echo "No JUnit-covered service changes detected."

      # 실패한 경우 GitHub Actions 아티팩트에서 Gradle HTML/XML 테스트 리포트를 확인할 수 있게 업로드한다.
      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: junit-test-reports
          path: |
            **/build/reports/tests/test/
            **/build/test-results/test/
            **/build/reports/tests/testIntegration/
            **/build/test-results/testIntegration/
          if-no-files-found: ignore

  build-and-scan:
    name: Docker Build & Trivy Scan
    runs-on: ubuntu-latest
    needs: test  # 테스트 통과 후 실행
    if: github.ref == 'refs/heads/main'  # main 브랜치에 push 시에만 실행

    strategy:
      matrix:
        # 빌드할 서비스 목록
        service:
          - eureka-server
          - api-gateway
          - patient-service
          - appointment-service
          - prescription-service
          - notification-service
          - dashboard

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      # jar 파일 빌드
      - name: Build jar
        run: ./gradlew :${{ matrix.service }}:bootJar --no-daemon

      # DockerHub 로그인
      - name: Login to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # Docker 이미지 빌드 & 푸시
      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: ./${{ matrix.service }}
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/${{ matrix.service }}:latest

      # Trivy로 이미지 취약점 스캔
      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ secrets.DOCKERHUB_USERNAME }}/${{ matrix.service }}:latest
          format: table
          severity: HIGH,CRITICAL  # HIGH, CRITICAL 취약점만 검사
          exit-code: '0'  # 취약점 발견해도 파이프라인 중단 안함 (1로 바꾸면 중단)
