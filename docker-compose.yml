services:
  # --- Infrastructure ---
  eureka-server:
    build:
      context: .
      dockerfile: eureka-server/Dockerfile
    ports:
      - "8761:8761"
    networks:
      - medical-net

  api-gateway:
    build:
      context: .
      dockerfile: api-gateway/Dockerfile
    ports:
      - "8080:8080"
    environment:
      - EUREKA_CLIENT_SERVICEURL_DEFAULTZONE=http://eureka-server:8761/eureka/
    depends_on:
      - eureka-server
    networks:
      - medical-net

  # --- Databases ---
  patient-db:
    image: postgres:15
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: patient_db
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U user -d patient_db"]
      interval: 5s
      timeout: 5s
      retries: 12
    networks:
      - medical-net

  appointment-db:
    image: postgres:15
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: appointment_db
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U user -d appointment_db"]
      interval: 5s
      timeout: 5s
      retries: 12
    networks:
      - medical-net

  prescription-db:
    image: postgres:15
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: prescription_db
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U user -d prescription_db"]
      interval: 5s
      timeout: 5s
      retries: 12
    networks:
      - medical-net

  # --- Application Services ---
  patient-service:
    build:
      context: .
      dockerfile: patient-service/Dockerfile
    ports:
      - "8081:8081"
    environment:
      - EUREKA_CLIENT_SERVICEURL_DEFAULTZONE=http://eureka-server:8761/eureka/
      - SPRING_DATASOURCE_URL=jdbc:postgresql://patient-db:5432/patient_db
      - SPRING_DATASOURCE_DRIVER_CLASS_NAME=org.postgresql.Driver
      - SPRING_DATASOURCE_USERNAME=user
      - SPRING_DATASOURCE_PASSWORD=password
      - SPRING_JPA_HIBERNATE_DDL_AUTO=update
    depends_on:
      eureka-server:
        condition: service_started
      patient-db:
        condition: service_healthy
    networks:
      - medical-net

  appointment-service:
    build:
      context: .
      dockerfile: appointment-service/Dockerfile
    ports:
      - "8082:8082"
    environment:
      - EUREKA_CLIENT_SERVICEURL_DEFAULTZONE=http://eureka-server:8761/eureka/
      - SPRING_DATASOURCE_URL=jdbc:postgresql://appointment-db:5432/appointment_db
      - SPRING_DATASOURCE_DRIVER_CLASS_NAME=org.postgresql.Driver
      - SPRING_DATASOURCE_USERNAME=user
      - SPRING_DATASOURCE_PASSWORD=password
      - SPRING_JPA_HIBERNATE_DDL_AUTO=update
    depends_on:
      eureka-server:
        condition: service_started
      appointment-db:
        condition: service_healthy
    networks:
      - medical-net

  prescription-service:
    build:
      context: .
      dockerfile: prescription-service/Dockerfile
    ports:
      - "8083:8083"
    environment:
      - EUREKA_CLIENT_SERVICEURL_DEFAULTZONE=http://eureka-server:8761/eureka/
      - SPRING_DATASOURCE_URL=jdbc:postgresql://prescription-db:5432/prescription_db
      - SPRING_DATASOURCE_DRIVER_CLASS_NAME=org.postgresql.Driver
      - SPRING_DATASOURCE_USERNAME=user
      - SPRING_DATASOURCE_PASSWORD=password
      - SPRING_JPA_HIBERNATE_DDL_AUTO=update
    depends_on:
      eureka-server:
        condition: service_started
      prescription-db:
        condition: service_healthy
    networks:
      - medical-net

  notification-service:
    build:
      context: .
      dockerfile: notification-service/Dockerfile
    ports:
      - "8084:8084"
    environment:
      - EUREKA_CLIENT_SERVICEURL_DEFAULTZONE=http://eureka-server:8761/eureka/
      - SPRING_DATASOURCE_URL=jdbc:h2:mem:notification_db
    depends_on:
      - eureka-server
    networks:
      - medical-net

  # --- Frontend ---
  dashboard:
    build: ./dashboard
    ports:
      - "80:80"
    networks:
      - medical-net

networks:
  medical-net:
    driver: bridge
