version: '3.8'

services:
  # --- Infrastructure ---
  eureka-server:
    build: ./eureka-server
    ports:
      - "8761:8761"
    networks:
      - medical-net

  api-gateway:
    build: ./api-gateway
    ports:
      - "8080:8080"
    environment:
      - EUREKA_CLIENT_SERVICEURL_DEFAULTZONE=http://eureka-server:8761/eureka/
    depends_on:
      - eureka-server
    networks:
      - medical-net

  # --- Databases ---
  patient-db:
    image: postgres:15
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: patient_db
    networks:
      - medical-net

  appointment-db:
    image: postgres:15
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: appointment_db
    networks:
      - medical-net

  prescription-db:
    image: postgres:15
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: prescription_db
    networks:
      - medical-net

  # --- Application Services ---
  patient-service:
    build: ./patient-service
    ports:
      - "8081:8081"
    environment:
      - EUREKA_CLIENT_SERVICEURL_DEFAULTZONE=http://eureka-server:8761/eureka/
      - SPRING_DATASOURCE_URL=jdbc:postgresql://patient-db:5432/patient_db
      - SPRING_DATASOURCE_USERNAME=user
      - SPRING_DATASOURCE_PASSWORD=password
      - SPRING_JPA_HIBERNATE_DDL_AUTO=update
    depends_on:
      - eureka-server
      - patient-db
    networks:
      - medical-net

  appointment-service:
    build: ./appointment-service
    ports:
      - "8082:8082"
    environment:
      - EUREKA_CLIENT_SERVICEURL_DEFAULTZONE=http://eureka-server:8761/eureka/
      - SPRING_DATASOURCE_URL=jdbc:postgresql://appointment-db:5432/appointment_db
      - SPRING_DATASOURCE_USERNAME=user
      - SPRING_DATASOURCE_PASSWORD=password
      - SPRING_JPA_HIBERNATE_DDL_AUTO=update
    depends_on:
      - eureka-server
      - appointment-db
    networks:
      - medical-net

  prescription-service:
    build: ./prescription-service
    ports:
      - "8083:8083"
    environment:
      - EUREKA_CLIENT_SERVICEURL_DEFAULTZONE=http://eureka-server:8761/eureka/
      - SPRING_DATASOURCE_URL=jdbc:postgresql://prescription-db:5432/prescription_db
      - SPRING_DATASOURCE_USERNAME=user
      - SPRING_DATASOURCE_PASSWORD=password
      - SPRING_JPA_HIBERNATE_DDL_AUTO=update
    depends_on:
      - eureka-server
      - prescription-db
    networks:
      - medical-net

  notification-service:
    build: ./notification-service
    ports:
      - "8084:8084"
    environment:
      - EUREKA_CLIENT_SERVICEURL_DEFAULTZONE=http://eureka-server:8761/eureka/
      - SPRING_DATASOURCE_URL=jdbc:h2:mem:notification_db
    depends_on:
      - eureka-server
    networks:
      - medical-net

  # --- Frontend ---
  dashboard:
    build: ./dashboard
    ports:
      - "80:80"
    networks:
      - medical-net

networks:
  medical-net:
    driver: bridge
