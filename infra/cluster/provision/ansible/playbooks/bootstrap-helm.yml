---
- name: Bootstrap Helm on the control plane
  hosts: kube_control_plane
  become: true
  gather_facts: true

  tasks:
    - name: Fail when Helm release architecture is unsupported
      ansible.builtin.fail:
        msg: "Unsupported Helm release architecture: {{ ansible_facts.architecture }}"
      when: ansible_facts.architecture not in helm_release_arch

    - name: Check existing Helm binary
      ansible.builtin.command: helm version --short
      register: existing_helm
      changed_when: false
      failed_when: false

    - name: Download Helm release archive
      ansible.builtin.get_url:
        url: "https://get.helm.sh/helm-{{ helm_version }}-linux-{{ helm_release_arch[ansible_facts.architecture] }}.tar.gz"
        dest: "/tmp/helm-{{ helm_version }}-linux-{{ helm_release_arch[ansible_facts.architecture] }}.tar.gz"
        mode: "0644"
      when: existing_helm.rc != 0 or helm_version not in existing_helm.stdout

    - name: Extract Helm release archive
      ansible.builtin.unarchive:
        src: "/tmp/helm-{{ helm_version }}-linux-{{ helm_release_arch[ansible_facts.architecture] }}.tar.gz"
        dest: /tmp
        remote_src: true
      when: existing_helm.rc != 0 or helm_version not in existing_helm.stdout

    - name: Install Helm binary
      ansible.builtin.copy:
        src: "/tmp/linux-{{ helm_release_arch[ansible_facts.architecture] }}/helm"
        dest: /usr/local/bin/helm
        mode: "0755"
        remote_src: true
      when: existing_helm.rc != 0 or helm_version not in existing_helm.stdout

    - name: Verify Helm installation
      ansible.builtin.command: helm version --short
      changed_when: false
