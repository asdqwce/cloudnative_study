---
- name: Bootstrap AWS ECR credential provider for kubelet
  hosts: workers
  become: true
  gather_facts: false
  vars:
    aws_region: "{{ lookup('env', 'AWS_REGION') | default('ap-northeast-2', true) }}"
    aws_ecr_credential_provider_version: "{{ lookup('env', 'AWS_ECR_CREDENTIAL_PROVIDER_VERSION') | default('v1.34.3', true) }}"
    aws_ecr_credential_provider_arch: "{{ lookup('env', 'AWS_ECR_CREDENTIAL_PROVIDER_ARCH') | default('arm64', true) }}"
    aws_ecr_credential_provider_bin_dir: /opt/kubelet-credential-providers
    aws_ecr_credential_provider_bin_path: "{{ aws_ecr_credential_provider_bin_dir }}/ecr-credential-provider"
    aws_ecr_credential_provider_config_path: /etc/kubernetes/ecr-credential-provider.yaml
    aws_ecr_credential_provider_download_url: "{{ lookup('env', 'AWS_ECR_CREDENTIAL_PROVIDER_DOWNLOAD_URL') | default('https://storage.googleapis.com/k8s-staging-provider-aws/releases/' ~ aws_ecr_credential_provider_version ~ '/linux/' ~ aws_ecr_credential_provider_arch ~ '/ecr-credential-provider-linux-' ~ aws_ecr_credential_provider_arch, true) }}"
    aws_ecr_credential_provider_cache_duration: "{{ lookup('env', 'AWS_ECR_CREDENTIAL_PROVIDER_CACHE_DURATION') | default('12h', true) }}"
    aws_ecr_credential_provider_match_images:
      - "*.dkr.ecr.*.amazonaws.com"
      - "*.dkr.ecr.*.amazonaws.com.cn"
      - "*.dkr.ecr-fips.*.amazonaws.com"

  tasks:
    - name: Check kubelet default environment exists
      ansible.builtin.stat:
        path: /etc/default/kubelet
      register: kubelet_default

    - name: Require kubelet default environment from cluster bootstrap
      ansible.builtin.fail:
        msg: "Run bootstrap-cluster.yml before bootstrap-aws-ecr-credential-provider.yml."
      when: not kubelet_default.stat.exists

    - name: Read kubelet default environment
      ansible.builtin.slurp:
        path: /etc/default/kubelet
      register: kubelet_default_file

    - name: Extract kubelet extra args
      ansible.builtin.set_fact:
        kubelet_extra_args_line: "{{ (kubelet_default_file.content | b64decode) | regex_search('(?m)^KUBELET_EXTRA_ARGS=.*$') | default('', true) }}"

    - name: Require kubelet extra args from cluster bootstrap
      ansible.builtin.fail:
        msg: "KUBELET_EXTRA_ARGS was not found in /etc/default/kubelet."
      when: kubelet_extra_args_line == ''

    - name: Build kubelet extra args with ECR credential provider flags
      ansible.builtin.set_fact:
        kubelet_ecr_extra_args_line: "{{ (kubelet_extra_args_line | regex_replace('\\s+--image-credential-provider-config=\\S+', '') | regex_replace('\\s+--image-credential-provider-bin-dir=\\S+', '')) ~ ' --image-credential-provider-config=' ~ aws_ecr_credential_provider_config_path ~ ' --image-credential-provider-bin-dir=' ~ aws_ecr_credential_provider_bin_dir }}"

    - name: Ensure ECR credential provider binary directory exists
      ansible.builtin.file:
        path: "{{ aws_ecr_credential_provider_bin_dir }}"
        state: directory
        mode: "0755"

    - name: Download ECR credential provider binary
      ansible.builtin.get_url:
        url: "{{ aws_ecr_credential_provider_download_url }}"
        dest: "{{ aws_ecr_credential_provider_bin_path }}"
        mode: "0755"
        force: true

    - name: Ensure Kubernetes config directory exists
      ansible.builtin.file:
        path: "{{ aws_ecr_credential_provider_config_path | dirname }}"
        state: directory
        mode: "0755"

    - name: Configure kubelet ECR credential provider
      ansible.builtin.copy:
        dest: "{{ aws_ecr_credential_provider_config_path }}"
        mode: "0644"
        content: |
          apiVersion: kubelet.config.k8s.io/v1
          kind: CredentialProviderConfig
          providers:
            - name: ecr-credential-provider
              matchImages:
          {% for image in aws_ecr_credential_provider_match_images %}
                - "{{ image }}"
          {% endfor %}
              defaultCacheDuration: "{{ aws_ecr_credential_provider_cache_duration }}"
              apiVersion: credentialprovider.kubelet.k8s.io/v1
              env:
                - name: AWS_REGION
                  value: {{ aws_region }}

    - name: Configure kubelet to call the ECR credential provider
      ansible.builtin.lineinfile:
        path: /etc/default/kubelet
        regexp: "^KUBELET_EXTRA_ARGS="
        line: "{{ kubelet_ecr_extra_args_line }}"
      register: kubelet_ecr_default

    - name: Restart kubelet after ECR credential provider change
      ansible.builtin.service:
        name: kubelet
        state: restarted
      when: kubelet_ecr_default.changed
