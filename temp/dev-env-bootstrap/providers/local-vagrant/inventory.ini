[kube_control_plane]
control-plane-1 ansible_host=10.10.10.10 ansible_user=vagrant ansible_ssh_private_key_file=~/.vagrant.d/insecure_private_key ansible_ssh_common_args='-o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null'

[kube_workers]
worker-1 ansible_host=10.10.10.11 ansible_user=vagrant ansible_ssh_private_key_file=~/.vagrant.d/insecure_private_key ansible_ssh_common_args='-o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null'
worker-2 ansible_host=10.10.10.12 ansible_user=vagrant ansible_ssh_private_key_file=~/.vagrant.d/insecure_private_key ansible_ssh_common_args='-o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null'

[k8s_cluster:children]
kube_control_plane
kube_workers

[k8s_cluster:vars]
ansible_python_interpreter=/usr/bin/python3
