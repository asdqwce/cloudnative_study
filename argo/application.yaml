apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: medical-platform
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/asdqwce/cloudnative_study.git
    targetRevision: HEAD
    path: k8s #변경사항 감지할 디렉토리
  destination:
    server: https://kubernetes.default.svc
    namespace: default
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
