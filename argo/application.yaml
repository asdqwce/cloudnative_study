apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: medical-platform-aws-apps
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/asdqwce/cloudnative_study.git
    # Decision point: Argo CD watches one concrete branch, not the whole release/** glob.
    # Keep this aligned with the release workflow MANIFEST_BRANCH value.
    targetRevision: release/aws-dev
    path: k8s/overlays/aws/apps
  destination:
    server: https://kubernetes.default.svc
    namespace: medical-platform
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
