server:
  port: 8081

spring:
  application:
    name: patient-service
  datasource:
    url: jdbc:h2:mem:patient_db;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password: 
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true

eureka:
  client:
    service-url:
      defaultZone: http://eureka-service:8761/eureka/
